<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>互動式 3D 晶體結構學習平台 | Crystal Structure Builder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- 控制面板 -->
  <aside id="panel">
    <h1>🔬 晶體結構建構器<span class="en">Crystal Structure Builder</span></h1>

    <section class="box">
      <label class="sec">預設結構 Preset</label>
      <select id="preset">
        <option value="">— 自訂 Custom —</option>
        <option value="graphite">石墨 Graphite (C)</option>
        <option value="perovskite">鈣鈦礦 Perovskite (SrTiO₃)</option>
        <option value="uranium">α-鈾 Uranium (α-U)</option>
        <option value="fcc">FCC 面心立方 (Cu)</option>
        <option value="bcc">BCC 體心立方 (Fe)</option>
        <option value="nacl">岩鹽 NaCl</option>
        <option value="diamond">鑽石 Diamond (C)</option>
      </select>
    </section>

    <section class="box">
      <label class="sec">晶系 Crystal System</label>
      <select id="system"></select>
    </section>

    <section class="box">
      <label class="sec">晶格參數 Lattice Parameters</label>
      <div class="params">
        <div class="prow"><label>a (Å)</label><input type="number" id="a" step="0.01" min="0.1"></div>
        <div class="prow"><label>b (Å)</label><input type="number" id="b" step="0.01" min="0.1"></div>
        <div class="prow"><label>c (Å)</label><input type="number" id="c" step="0.01" min="0.1"></div>
        <div class="prow"><label>α (°)</label><input type="number" id="al" step="0.1" min="1" max="179"></div>
        <div class="prow"><label>β (°)</label><input type="number" id="be" step="0.1" min="1" max="179"></div>
        <div class="prow"><label>γ (°)</label><input type="number" id="ga" step="0.1" min="1" max="179"></div>
      </div>
    </section>

    <section class="box">
      <label class="sec">基元 Motif / Basis(分數座標)</label>
      <table id="motif"><thead><tr><th>元素</th><th>x</th><th>y</th><th>z</th><th></th></tr></thead><tbody></tbody></table>
      <button id="addAtom" class="mini">＋ 新增原子</button>
    </section>

    <section class="box">
      <label class="sec">顯示 Display</label>
      <div class="prow"><label>重複 nx</label><input type="number" id="nx" value="1" min="1" max="5" step="1"></div>
      <div class="prow"><label>重複 ny</label><input type="number" id="ny" value="1" min="1" max="5" step="1"></div>
      <div class="prow"><label>重複 nz</label><input type="number" id="nz" value="1" min="1" max="5" step="1"></div>
      <label class="chk"><input type="checkbox" id="fill" checked> 補齊邊界原子(角/邊/面)</label>
      <label class="chk"><input type="checkbox" id="showCell" checked> 顯示單位晶胞框</label>
      <label class="chk"><input type="checkbox" id="showAxes" checked> 顯示 a/b/c 軸</label>
      <label class="chk"><input type="checkbox" id="showBonds"> 顯示鍵結 Bonds</label>
      <div class="prow"><label>鍵長上限 (Å)</label><input type="number" id="bondCut" value="2.0" step="0.1" min="0.5" max="4"></div>
    </section>

    <section class="box actions">
      <button id="rebuild" class="primary">🔄 重建 Rebuild</button>
      <button id="reset" class="mini">重置視角</button>
    </section>

    <div id="info"></div>
    <div class="foot">拖曳旋轉 · 滾輪縮放 · 右鍵平移　｜　NANOMATERIALS 教學用</div>
  </aside>

  <!-- 3D 畫布 -->
  <div id="stage"><canvas id="gl"></canvas><div id="legend"></div></div>
</div>

<script src="three.min.js"></script>
<script src="app.js"></script>
</body>
</html>
