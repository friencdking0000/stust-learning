<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stustclass 互動學習網站</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-top">
      <a class="brand" href="#/">📚 stustclass<span class="ver">互動學習網站 v3</span></a>
      <button id="menu-btn" aria-label="選單" aria-expanded="false">☰</button>
    </div>
    <div id="side-panel">
      <input id="search" type="search" placeholder="🔍 搜尋筆記與例題…" autocomplete="off">
      <div class="textsize">字體 <button id="fs-dn" title="縮小">A−</button><button id="fs-rs" title="預設">A</button><button id="fs-up" title="放大">A+</button></div>
      <nav id="course-nav"></nav>
      <div class="side-foot">A→F 流程產出 · 互動學習<br><span id="gen"></span></div>
    </div>
  </aside>
  <main id="main"></main>
</div>

<!-- 圖片燈箱 -->
<div id="lightbox" class="hidden">
  <button id="lb-close" title="關閉 (Esc)">✕</button>
  <button id="lb-prev" title="上一張 (←)">‹</button>
  <img id="lb-img" alt="">
  <button id="lb-next" title="下一張 (→)">›</button>
  <div id="lb-cap"></div>
</div>

<script>
  window.MathJax = {
    tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]], displayMath: [["$$", "$$"], ["\\[", "\\]"]], processEscapes: true },
    svg: { fontCache: "local" },
    startup: { typeset: false }
  };
</script>
<script src="mathjax-tex-svg.js" id="MathJax-script" async></script>
<script src="marked.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
